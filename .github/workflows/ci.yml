name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate safe configuration
        run: python scripts/validate_config.py

      - name: Run unit and security regression tests
        run: python -m unittest discover -s tests -v

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  agent-benchmark:
    if: ${{ vars.CLAUDE_BENCHMARK_MODEL != '' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install benchmark dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          npm install --global @anthropic-ai/claude-code
      - name: Run real agent benchmark
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/run_benchmark.py --agent vulnerability-agent --model '${{ vars.CLAUDE_BENCHMARK_MODEL }}' --timeout-seconds 120 --scope-id synthetic-lab-v1 --predictions-out .local/predictions.json --manifest-out .local/benchmark-run.json
          python scripts/evaluate_benchmark.py --cases benchmarks/cases --predictions .local/predictions.json --json-out .local/benchmark-results.json
