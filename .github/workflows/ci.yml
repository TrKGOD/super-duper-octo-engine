name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # The original required check. Name and platform are unchanged so existing branch protection keeps working.
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install isolated Chromium runtime for browser-auth tests
        run: python -m playwright install --with-deps chromium

      - name: Validate safe configuration
        run: python scripts/validate_config.py

      - name: Validate JSON contracts
        run: python scripts/validate_contracts.py

      - name: Validate Claude Code Skill Registry (versions and pinned content hashes)
        run: python scripts/skill_registry.py validate

      - name: Validate agent tool declarations
        run: python scripts/validate_agent_tools.py

      - name: Validate agent contracts against the implementation and the generated documentation
        run: python scripts/validate_agent_contracts.py --check-docs

      - name: Compile Python sources
        run: python -m compileall -q core scripts tests hooks

      - name: Run unit and security regression tests
        env:
          # Chromium was installed above: the real-browser tests must run here, never skip.
          WITHERHOARD_REQUIRE_BROWSER: "1"
        run: python -m unittest discover -s tests -v

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The framework is used on Windows workstations as well as Linux CI: process-tree termination, path and
  # link handling, file permissions and the worker backend differ per platform, so the suite runs on both,
  # and on more than one Python version. Browser binaries are not installed here (the browser tests report an
  # explicit skip); the `test` job above runs them.
  compatibility:
    name: compatibility (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # bash runs with -e on both platforms; the Windows default (PowerShell) reports only the LAST command's
        # exit code, so a failing validator in a multi-command step would be masked.
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python: "3.12" }
          - { os: ubuntu-24.04, python: "3.13" }
          - { os: windows-2022, python: "3.11" }
          - { os: windows-2022, python: "3.13" }
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate configuration, contracts, skills and agents
        run: |
          python scripts/validate_config.py
          python scripts/validate_contracts.py
          python scripts/skill_registry.py validate
          python scripts/validate_agent_tools.py
          python scripts/validate_agent_contracts.py --check-docs

      - name: Compile Python sources
        run: python -m compileall -q core scripts tests hooks

      - name: Run unit and security regression tests
        run: python -m unittest discover -s tests

  # Verifies the isolation the container backend CLAIMS against a real runtime (tests/test_container_integration.py).
  # The gate makes a missing runtime or image a hard failure: this job can never pass by skipping.
  container-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WITHERHOARD_CONTAINER_TESTS: "1"
      WITHERHOARD_CONTAINER_TESTS_DEDICATED_RUNTIME: "1"
      WITHERHOARD_CONTAINER_TEST_IMAGE: "busybox:1.36"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Provision the test image (the backend runs with --pull never)
        run: |
          docker version
          docker info --format 'cgroup={{.CgroupVersion}} driver={{.CgroupDriver}} security={{.SecurityOptions}}' || true
          docker pull "$WITHERHOARD_CONTAINER_TEST_IMAGE"
          docker image inspect --format '{{json .RepoDigests}}' "$WITHERHOARD_CONTAINER_TEST_IMAGE" || true

      - name: Verify container isolation and lifecycle against the real runtime
        run: python -m unittest -v tests.test_container_integration tests.test_worker_hardening

  # Advisory: reports known vulnerabilities in the pinned dependencies without turning the check red, because a new
  # advisory against a third-party package must not make an unrelated change look broken. The findings are written
  # to the job summary and raised as a warning annotation; read them there.
  dependency-audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Audit pinned dependencies
        id: audit
        continue-on-error: true
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt -r requirements-browser.txt 2>&1 | tee audit.txt
          exit "${PIPESTATUS[0]}"

      - name: Publish the audit result
        if: always()
        run: |
          {
            echo '### pip-audit (advisory)'
            echo
            echo '```'
            cat audit.txt 2>/dev/null || echo 'no audit output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.audit.outcome }}" = "failure" ]; then
            echo "::warning title=pip-audit::known vulnerabilities in pinned dependencies - see the job summary"
          fi

  agent-benchmark:
    if: ${{ vars.CLAUDE_BENCHMARK_MODEL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install benchmark dependencies
        run: |
          python -m pip install -r requirements.txt
          npm install --global @anthropic-ai/claude-code
      - name: Smoke-test the configured Claude Code specialist
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/runtime_smoke.py --agent vulnerability-agent --model '${{ vars.CLAUDE_BENCHMARK_MODEL }}' --timeout-seconds 90
      - name: Run real agent benchmark
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/run_benchmark.py --agent vulnerability-agent --model '${{ vars.CLAUDE_BENCHMARK_MODEL }}' --timeout-seconds 120 --scope-id synthetic-lab-v1 --predictions-out .local/predictions.json --manifest-out .local/benchmark-run.json
          python scripts/evaluate_benchmark.py --cases benchmarks/cases --predictions .local/predictions.json --json-out .local/benchmark-results.json
